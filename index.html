<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영재학교 모의고사 관리</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7cff'/%3E%3Cstop offset='1' stop-color='%2345d4c8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M8 23V13M14 23V9M20 23v-7M26 23V11' stroke='%230a0d18' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --bg:#080b14; --bg2:#0d1220; --glass:rgba(255,255,255,.035); --glass2:rgba(255,255,255,.06); --glass3:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14); --text:#eef1f8; --sub:#b7bdcc; --muted:#7d8599;
  --a1:#8b7cff; --a2:#45d4c8; --gold:#e6c27a; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --grad:linear-gradient(135deg,var(--a1),var(--a2)); --ease:cubic-bezier(.22,.8,.24,1); --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Pretendard",-apple-system,"Malgun Gothic",sans-serif;font-size:14px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;background:
  radial-gradient(40% 35% at 15% 10%,rgba(139,124,255,.20),transparent 70%),
  radial-gradient(35% 35% at 90% 85%,rgba(69,212,200,.14),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:var(--glass2);border-radius:12px;padding:9px 16px;transition:all .2s var(--ease)}
button:hover{background:var(--glass3);border-color:rgba(255,255,255,.22)}
button:disabled{opacity:.45;cursor:default}
button.primary{border:none;background:var(--grad);color:#0a0d18;font-weight:700;box-shadow:0 8px 24px -10px rgba(139,124,255,.7)}
button.primary:hover{filter:brightness(1.08)}
button.orange{border:none;background:linear-gradient(135deg,#fb923c,#f59e0b);color:#1a0f00;font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--sub)}
button.ghost:hover{background:var(--glass2);color:var(--text)}
button.danger{color:#fca5a5;border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.06)}
button.small{padding:5px 11px;font-size:12px;border-radius:9px}
input,select,textarea,.fsel{background:rgba(0,0,0,.28);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus,.fsel:focus,.fsel.open{outline:none;border-color:rgba(139,124,255,.7);box-shadow:0 0 0 3px rgba(139,124,255,.18)}
select option{background:#151a2a}
textarea{width:100%;resize:vertical;line-height:1.6}
h1,h2,h3,h4,p{margin:0}
.hidden{display:none!important}
.muted{color:var(--muted)}.sub{color:var(--sub)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* 로그인 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:min(400px,100%);padding:34px 30px;border-radius:24px;background:rgba(18,24,40,.75);border:1px solid var(--line2);box-shadow:0 40px 100px rgba(0,0,0,.45)}
.lbox h1{font-size:22px;margin:14px 0 6px}.lbox p{color:var(--sub);font-size:13px;line-height:1.6}
.lbox input{width:100%;margin-top:16px;padding:12px 14px}.lbox button{width:100%;margin-top:12px;padding:12px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center}
.err{color:#fca5a5;font-size:13px;margin-top:10px;min-height:18px}

/* 앱 */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);background:rgba(8,11,20,.6);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:hidden}
aside>*{flex-shrink:0}aside>.exwrap{flex:0 1 auto;min-height:90px;display:flex;flex-direction:column}
.exwrap .exlist{overflow-y:auto;min-height:0;padding-right:4px;margin-right:-4px}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:15px;cursor:pointer;border-radius:10px}
.brand:hover{opacity:.85}
.brand .logo{width:34px;height:34px;border-radius:10px}
.lab{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
aside select{width:100%}
.exlist{display:flex;flex-direction:column;gap:6px}
.exlist.off .excard{opacity:.35;cursor:not-allowed;pointer-events:none}
.trnote{font-size:12.5px;line-height:1.55;color:#a7f3d0;background:rgba(94,234,212,.08);border:1px solid rgba(94,234,212,.35);border-radius:10px;padding:8px 10px;margin-bottom:2px}
.excard{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer;text-align:left;width:100%}
.excard b{font-size:14px}.excard .m{font-size:12px;color:var(--muted);margin-top:2px}
.excard.on{border-color:var(--a1);background:rgba(139,124,255,.12)}
main{min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(8,11,20,.7);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:none;background:transparent;color:var(--sub);padding:8px 14px;border-radius:10px;font-weight:600}
.tab.on{background:var(--glass3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.tab[data-t="manage"]{color:#5eead4}.tab[data-t="manage"].on{color:#5eead4;box-shadow:inset 0 0 0 1px rgba(94,234,212,.5)}
.tab[data-t="users"]{color:#f9a8d4}.tab[data-t="users"].on{color:#f9a8d4;box-shadow:inset 0 0 0 1px rgba(249,168,212,.5)}
.tab[data-t="config"]{color:var(--gold)}.tab[data-t="config"].on{color:var(--gold);box-shadow:inset 0 0 0 1px rgba(230,194,122,.5)}
.sep{width:1px;height:22px;background:var(--line2);margin:0 6px}
.extitle{font-weight:800;font-size:15px;margin-right:12px;color:var(--sub)}
.extitle.on{display:inline-flex;align-items:baseline;gap:8px;padding:6px 14px 6px 12px;border-radius:12px;border:1px solid rgba(94,234,212,.5);background:linear-gradient(135deg,rgba(94,234,212,.14),rgba(99,102,241,.12));box-shadow:0 0 0 3px rgba(94,234,212,.06),0 6px 18px rgba(0,0,0,.25);color:var(--text)}
.extitle .ey,.extitle .er{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.02em}.extitle.on{gap:6px}
.extitle .ed{width:8px;height:8px;border-radius:50%;background:#5eead4;box-shadow:0 0 8px #5eead4;align-self:center}
.content{padding:20px;min-width:0}
.card{border:1px solid var(--line);background:var(--glass);border-radius:var(--r);padding:18px}
.card h3{font-size:15px;margin-bottom:12px}
.empty{padding:60px 20px;text-align:center;color:var(--sub);line-height:1.8;font-size:16px}
.empty.warn::before{content:"⚠️";display:block;font-size:28px;margin-bottom:8px}
.empty.warn{color:var(--text);font-size:14px;font-weight:700}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b2236;border:1px solid var(--line2);padding:11px 18px;border-radius:12px;z-index:300;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.dirty{position:fixed;right:20px;bottom:20px;z-index:150;background:rgba(251,146,60,.14);border:1px solid rgba(251,146,60,.6);color:#fdba74;padding:10px 14px;border-radius:12px;display:flex;gap:10px;align-items:center}
.busy{position:fixed;inset:0;z-index:250;background:rgba(4,6,12,.6);display:flex;align-items:center;justify-content:center}
.busy .bx{background:#121828;border:1px solid var(--line2);padding:22px 28px;border-radius:16px;min-width:320px;text-align:center}
.bar{height:8px;border-radius:9px;background:var(--glass3);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grad);width:0}
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(4,6,12,.62);backdrop-filter:blur(6px)}
.modal .mbox{width:min(440px,92vw);padding:24px;border-radius:18px;background:#121828;border:1px solid var(--line2);max-height:88vh;overflow:auto}
.modal .mbox.wide{width:min(820px,94vw)}
.modal h3{margin-bottom:10px}

/* 표 */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 190px)}
table.g{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap}
table.g th,table.g td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;height:28px}
table.g thead th{position:sticky;background:#141a2b;z-index:3;font-weight:600;color:var(--sub);padding:0 6px}
table.g thead tr:nth-child(1) th{top:0}table.g thead tr:nth-child(2) th{top:28px}table.g thead tr:nth-child(3) th{top:56px}table.g thead tr:nth-child(4) th{top:84px}
table.g .stk{position:sticky;z-index:2;background:#0f1424}
table.g thead .stk{z-index:4;background:#141a2b}
table.g td input{width:100%;height:27px;border:none;border-radius:0;background:transparent;text-align:center;padding:0 3px}
table.g td input:focus{box-shadow:inset 0 0 0 2px var(--a1);background:rgba(139,124,255,.1)}
table.g td.nm input{text-align:center}
table.g td.dup input{background:rgba(59,130,246,.35)}
table.g td.over input{background:rgba(248,113,113,.3)}
table.g td.auto{background:rgba(69,212,200,.05);padding:0 7px;color:#bff5ef;font-variant-numeric:tabular-nums}
table.g th.m{color:#c4b5fd}table.g th.s{color:#5eead4}
table.g tr.avg td{color:var(--gold);background:rgba(230,194,122,.05)}
/* 선택한 칸의 학생 줄·문항 열 강조 */
table.g tr.xr td,table.g td.xc{background:rgba(230,194,122,.08)}
table.g tr.xr td.stk{background:#2d2c30;color:var(--gold)!important}
table.g tr.xr td.nm input{color:var(--gold);font-weight:700}
table.g thead th.xh{background:#2d2c30!important;color:var(--gold)!important;font-weight:700}
table.v{border-collapse:collapse;font-size:13px;width:100%}
table.v th,table.v td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center;white-space:nowrap}
table.v thead th{position:sticky;top:0;background:#141a2b;color:var(--sub);font-weight:600;z-index:2}
table.v th.sortable{cursor:pointer;user-select:none}table.v th.sortable:hover{color:var(--text)}table.v th.sortable.on{color:#5eead4;font-weight:700}
table.v thead tr.subrow th{font-size:11.5px;font-weight:500;padding-top:4px;padding-bottom:4px}
table.v thead tr.mxrow th{background:#0f1424;color:var(--muted);font-weight:400}
table.v td.l{text-align:left}
table.v tr.ygap td{border-top:2px solid rgba(139,124,255,.55)}
table.v tr:hover td{background:rgba(255,255,255,.025)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--glass3);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1200px){.grid2{grid-template-columns:1fr}}
.itemtbl input,.itemtbl select{width:100%;padding:5px 7px}
.qtbl{table-layout:fixed;width:auto}.qtbl input.bad{border-color:#f87171;background:rgba(248,113,113,.12)}
.warnTxt{color:#fbbf24;font-weight:600}
.savest{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);white-space:nowrap}
.savest.ok{color:#5eead4;border-color:rgba(94,234,212,.4)}.savest.saving{color:#fbbf24;border-color:rgba(251,191,36,.45)}
.viewers{font-size:12.5px;color:var(--sub);white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}.viewers b{color:#86efac;font-weight:600}
.pres{font-size:12px;white-space:nowrap}.pres.on{color:#86efac}.pres.bg{color:var(--muted)}
.savest.fail{color:#fca5a5;border-color:rgba(248,113,113,.55);cursor:pointer}
.histbox{margin-top:14px}.histbox h4{margin:0 0 6px;font-size:14px}.histbox table td,.histbox table th{font-size:12.5px}
.combo{position:relative;display:inline-block}
.combolist{position:absolute;left:0;top:calc(100% + 4px);min-width:100%;width:max-content;max-width:320px;max-height:min(360px,60vh);overflow-y:auto;z-index:50;background:#141a2b;border:1px solid var(--line2);border-radius:10px;padding:4px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.combolist .ci{padding:6px 10px;border-radius:7px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.combolist .ci:hover,.combolist .ci.on{background:#2563eb;color:#fff}.combolist .ce{padding:8px 10px;font-size:13px;color:var(--muted)}
.combolist .ci.sel{font-weight:700;color:#5eead4}.combolist .ci.sel.on,.combolist .ci.sel:hover{color:#fff}
#fpop{position:fixed;top:0;left:0}
select.fs-src{display:none!important}
.fsel{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left;white-space:nowrap;line-height:1.4}
.fsel:hover{border-color:rgba(255,255,255,.22);background:rgba(0,0,0,.28)}
.fsel::after{content:"";width:7px;height:7px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:translateY(-2px) rotate(45deg);flex:none}
aside .fsel,.itemtbl .fsel{width:100%}.itemtbl .fsel{padding:5px 7px;font-weight:500}
select option{background:#141a2b;color:#e2e8f0}
.trgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1200px){.trgrid{grid-template-columns:1fr 1fr}}
.trc{padding:14px 14px 10px}.trt{font-size:14px;font-weight:700;margin-bottom:6px}.trbox{height:210px;position:relative}
input.ratio.bad{border-color:#f87171;background:rgba(248,113,113,.12)}
.convbox{margin-top:10px;padding:12px 14px;border-radius:12px;border:1px solid rgba(94,234,212,.5);background:linear-gradient(135deg,rgba(94,234,212,.12),rgba(99,102,241,.10))}
.convbox.warn{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.10);color:#fbbf24;font-weight:600;font-size:14px}
.convbox .cap{font-size:12.5px;font-weight:700;color:#5eead4;margin-bottom:8px}
.convbox .cvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.convbox .cv{background:rgba(8,11,20,.45);border-radius:10px;padding:8px 10px;text-align:center}
.convbox .cv .l{font-size:12px;color:var(--sub)}.convbox .cv .v{font-size:22px;font-weight:800;color:#fff;margin:2px 0}.convbox .cv .s{font-size:11px;color:var(--muted)}
.innote{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,auto) minmax(0,auto);justify-content:end;column-gap:22px;row-gap:3px;font-size:12px;color:var(--sub);line-height:1.5;min-width:0;margin-left:auto}
.innote~*,.kpis:has(+.seg),.kpis+.seg{flex-shrink:0}.innote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.innote i.bl{font-style:normal;background:rgba(59,130,246,.35);padding:0 4px;border-radius:4px}

.guide h3{margin:0 0 6px;font-size:20px}.guide .gsub{font-size:14.5px;color:var(--sub);line-height:1.7}.guide .gsec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)}
.guide h4{margin:0 0 8px;font-size:16.5px;font-weight:700;color:#5eead4}
.guide ul{margin:0;padding-left:20px;line-height:1.85;font-size:15px}.guide li b{color:var(--text)}
.guide .kbd{display:inline-block;padding:0 6px;border:1px solid var(--line2);border-radius:5px;font-size:13px}
.modal .mbox.wide:has(.guide){width:min(940px,94vw)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.28);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.5);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.35) transparent}}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.seg button{border:none;border-radius:0;background:transparent;padding:9px 16px;color:var(--sub)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--grad);color:#0a0d18;font-weight:700}

table.v td.b0,table.v th.b0{border-left:2px solid var(--line2)}
table.v td.big{font-weight:800;color:var(--text);font-size:13.5px}
table.v th.fold{cursor:pointer;user-select:none}table.v th.fold:hover{color:var(--text)}
.kpi{padding:10px 14px;border-radius:12px;background:var(--glass2);border:1px solid var(--line);min-width:110px}
.kpi .k{font-size:11.5px;color:var(--muted)}.kpi .v{font-size:18px;font-weight:800;margin-top:2px}

/* 성적표 (A4) — 글꼴: Pretendard(생기부 성적표와 같은 글꼴). PDF용으로 4가지 굵기만 따로 등록 */
@font-face{font-family:"WZP";font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2) format("woff2")}
@font-face{font-family:"WZP";font-weight:600;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2) format("woff2")}
@font-face{font-family:"WZP";font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2) format("woff2")}
@font-face{font-family:"WZP";font-weight:800;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-ExtraBold.woff2) format("woff2")}
.rpwrap{display:flex;flex-direction:column;align-items:center;gap:24px;padding:10px 0 40px;overflow:auto}
.rp{--wr:#047857;--wr2:#0891b2;--wg:#10b981;--ink:#0f172a;--sub2:#64748b;--ln:#e2e8f0;--pale:#f8fafc;
  width:794px;height:1123px;background:#fff;color:var(--ink);padding:36px 44px 30px;display:flex;flex-direction:column;font-family:"WZP","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:12px;letter-spacing:-.02em;box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative;overflow:hidden}
.rp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(180deg,var(--wr),var(--wr2))}
.rp .hd{display:flex;align-items:center;gap:18px;padding-bottom:12px;border-bottom:3px solid var(--wr);position:relative}
.rp .hd::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:1px;background:var(--wg)}
.rp .hd img{height:54px;width:auto}
.rp .hd .tt{flex:1;text-align:right}
.rp .t1{font-size:12px;font-weight:700;color:var(--wr);letter-spacing:.12em}
.rp .t2{font-size:22px;font-weight:800;color:var(--ink);margin-top:2px;letter-spacing:-.03em}
.rp .t2 b{color:var(--wr)}
.rp .who{display:flex;gap:10px;margin:22px 0 0;align-items:stretch}
.rp .who .id{flex:0 0 210px;border:1px solid var(--ln);border-radius:10px;padding:10px 14px;background:var(--pale);display:flex;flex-direction:column;justify-content:center}

const safeName = (s) => String(s).replace(/[\\/:*?"<>|]/g, "_");
// 엑셀이 "1-1" 같은 문항번호를 날짜(1월 1일 = 46023 같은 숫자)로 바꿔 버린 경우 되돌림
function fixNo(v) {
  if (typeof v === "number" && v >= 20000 && v < 80000 && Number.isInteger(v)) {
    const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000);
    return `${d.getUTCMonth() + 1}-${d.getUTCDate()}`;
  }
  const t = String(v ?? "").trim();
  return /^\d{5}$/.test(t) && +t >= 20000 && +t < 80000 ? fixNo(+t) : t;
}

// ======================= 계산 (기존 구글시트 수식과 동일) =======================
const isNum = (v) => typeof v === "number" && Number.isFinite(v);
function parseRatio(s) {
  const t = String(s ?? "").trim();
  const m = t.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
  if (m) return Number(m[1]) / Number(m[2]);
  const n = Number(t); return Number.isFinite(n) ? n : 0;
}
const R9 = (x) => Math.round(x * 1e9) / 1e9;
function rankOf(vals) { // RANK.EQ(내림차순), 숫자만. 반환: 순위 배열(숫자 아님은 null)
  const nums = vals.filter(isNum).map(R9);
  return vals.map((v) => (isNum(v) ? 1 + nums.filter((x) => x > R9(v)).length : null));
}
const avg = (a) => { const n = a.filter(isNum); return n.length ? n.reduce((x, y) => x + y, 0) / n.length : null; };
function sumOrDash(arr) { const n = arr.filter(isNum); return n.length ? n.reduce((x, y) => x + y, 0) : null; }

function calc(ex) {
  const c = ex.config, st = ex.students.filter((s) => s.name);
  const km = parseRatio(c.conv?.math ?? "1.2"), ks = parseRatio(c.conv?.sci ?? "2/3");
  const mA = c.math.areas, sA = c.sci.areas;
  const areaIdx = (items, area) => items.map((it, i) => (it.area === area ? i : -1)).filter((i) => i >= 0);
  const mIdx = mA.map((a) => areaIdx(c.math.items, a)), sIdx = sA.map((a) => areaIdx(c.sci.items, a));
  const areaScore = (vals, idx) => { const v = idx.map((i) => vals[i]).filter(isNum); return v.length ? v.reduce((x, y) => x + y, 0) : null; };
  const max = {
    m: mIdx.map((ix) => ix.reduce((x, i) => x + (Number(c.math.items[i].max) || 0), 0)),
    s: sIdx.map((ix) => ix.reduce((x, i) => x + (Number(c.sci.items[i].max) || 0), 0)),
  };
  max.mt = max.m.reduce((x, y) => x + y, 0); max.st = max.s.reduce((x, y) => x + y, 0); max.tot = max.mt + max.st;
  max.cm = max.mt * km; max.cs = max.st * ks; max.ct = max.cm + max.cs;
  const rows = st.map((s) => {
    const m = mIdx.map((ix) => areaScore(s.m, ix)), sc = sIdx.map((ix) => areaScore(s.s, ix));
    const mt = sumOrDash(m), stt = sumOrDash(sc), tot = sumOrDash([mt, stt]);
    const conv = tot === null ? null : (isNum(mt) ? mt * km : 0) + (isNum(stt) ? stt * ks : 0);
    return { name: s.name, center: s.center, m, s: sc, mt, st: stt, tot, conv, cm: isNum(mt) ? mt * km : null, cs: isNum(stt) ? stt * ks : null };
  });
  // 순위·백분위 (백분위 = 석차 / 응시자 수)
  const cols = {};
  const addCol = (key, get) => {
    const v = rows.map(get), rk = rankOf(v), n = v.filter(isNum).length;
    cols[key] = { v, rk, n, pct: rk.map((r) => (r == null ? null : r / n)), avg: avg(v) };
  };
  mA.forEach((_, i) => addCol("m" + i, (r) => r.m[i]));
  sA.forEach((_, i) => addCol("s" + i, (r) => r.s[i]));
  addCol("mt", (r) => r.mt); addCol("st", (r) => r.st); addCol("tot", (r) => r.tot); addCol("conv", (r) => r.conv);
  // 평균 (시트: 과목 평균 = 영역 평균의 합)
  const A = { m: mA.map((_, i) => cols["m" + i].avg), s: sA.map((_, i) => cols["s" + i].avg) };
  A.mt = sumOrDash(A.m); A.st = sumOrDash(A.s); A.tot = sumOrDash([A.mt, A.st]);
  A.cm = isNum(A.mt) ? A.mt * km : null; A.cs = isNum(A.st) ? A.st * ks : null;

  const bands = [[.05, .10], [.10, .15], [.15, .20], [.20, .25], [.25, .30]].map(([lo, hi]) => {
    const pick = (k, f) => avg(rows.map((r, i) => { const p = cols[k].pct[i]; return p != null && p >= lo - 1e-12 && p < hi - 1e-12 ? r[k] : null; }));
    const am = pick("mt"), as = pick("st");

  });

  const cuts = (c.cutoffs || []).map((x) => {
    const pm = isNum(x.math) ? cutPct(cols.mt.v, x.math / km) : null;
    const ps = isNum(x.sci) ? cutPct(cols.st.v, x.sci / ks) : null;
    const t = (isNum(x.math) || isNum(x.sci)) ? (x.math || 0) + (x.sci || 0) : null;
    const pt = t != null ? cutPct(cols.conv.v, t) : null;
    return { name: x.name, math: x.math, sci: x.sci, tot: t, pm, ps, pt };
  });
  const itemAvg = { m: c.math.items.map((_, i) => avg(st.map((s) => s.m[i]))), s: c.sci.items.map((_, i) => avg(st.map((s) => s.s[i]))) };
  return { rows, cols, A, max, bands, cuts, km, ks, mA, sA, N: rows.length, itemAvg, stu: st };
}
function cutPct(vals, cut) { const n = vals.filter(isNum); if (!n.length) return null; return Math.min(1, (n.filter((v) => R9(v) > R9(cut)).length + 1) / n.length); }
const f1 = (v) => (isNum(v) ? (Math.round(v * 10 + 1e-9) / 10).toFixed(1) : "-");
const fp = (v, dash = "-") => (isNum(v) ? (Math.round(v * 1000 + 1e-9) / 10).toFixed(1) + "%" : dash);

// 드롭다운 통일: 모든 <select>를 같은 모양의 목록(.combolist)으로 보여 줌. 원래 select는 숨겨 두고 값·change 이벤트는 그대로 사용.
const FS = { pop: null, sel: null, btn: null, cur: -1 };

  fsClose();
  if (!FS.pop) { FS.pop = document.createElement("div"); FS.pop.id = "fpop"; FS.pop.className = "combolist"; document.body.appendChild(FS.pop);
    FS.pop.addEventListener("mousedown", (e) => { const d = e.target.closest(".ci"); e.preventDefault(); if (d) fsPick(Number(d.dataset.n)); }); }
  FS.sel = sel; FS.btn = b; FS.cur = sel.selectedIndex; b.classList.add("open");
  FS.pop.innerHTML = [...sel.options].map((o, n) => `<div class="ci ${n === sel.selectedIndex ? "sel on" : ""}" data-n="${n}">${esc(o.textContent)}</div>`).join("");
  FS.pop.classList.remove("hidden");
  const r = b.getBoundingClientRect(), below = innerHeight - r.bottom - 8, above = r.top - 8;
  FS.pop.style.minWidth = r.width + "px"; FS.pop.style.left = Math.min(r.left, innerWidth - FS.pop.offsetWidth - 8) + "px";
  const h = Math.min(FS.pop.scrollHeight, 360);
  if (below >= h || below >= above) { FS.pop.style.top = r.bottom + 4 + "px"; FS.pop.style.maxHeight = Math.min(360, below) + "px"; }
  else { FS.pop.style.maxHeight = Math.min(360, above) + "px"; FS.pop.style.top = r.top - 4 - Math.min(h, above) + "px"; }
  fsMark();
}
function fsMark() { $$(".ci", FS.pop).forEach((d, n) => { d.classList.toggle("on", n === FS.cur); if (n === FS.cur) d.scrollIntoView({ block: "nearest" }); }); }
function fsPick(n) {
  const sel = FS.sel; if (!sel || n < 0) return fsClose();
  const changed = sel.selectedIndex !== n; sel.selectedIndex = n; fsSync(sel); const b = FS.btn; fsClose(); b?.focus();
  if (changed) sel.dispatchEvent(new Event("change", { bubbles: true }));
}
function fsClose() { if (FS.pop) FS.pop.classList.add("hidden"); FS.btn?.classList.remove("open"); FS.sel = null; FS.btn = null; }
document.addEventListener("mousedown", (e) => { if (FS.sel && !e.target.closest("#fpop") && e.target !== FS.btn && !FS.btn?.contains(e.target)) fsClose(); });
window.addEventListener("scroll", (e) => { if (FS.sel && !(e.target instanceof Element && e.target.closest?.("#fpop"))) fsClose(); }, true);
window.addEventListener("resize", fsClose);
new MutationObserver((ms) => ms.forEach((m) => {
  m.addedNodes.forEach((nd) => { if (nd.nodeType !== 1) return; if (nd.tagName === "SELECT") fsEnhance(nd); else nd.querySelectorAll?.("select").forEach(fsEnhance); });
  const sel = m.target.closest?.("select"); if (sel) fsSync(sel);
})).observe(document.body, { childList: true, subtree: true });
document.querySelectorAll("select").forEach(fsEnhance);
function fsSyncAll() { document.querySelectorAll("select.fs-src").forEach(fsSync); }

// 센터명은 "송도"처럼 이름만 (끝의 "센터"는 자동으로 뺌)
function normCenter(v) { const t = String(v ?? "").replace(/\s+/g, ""); return t !== "센터" ? t.replace(/센터$/, "") : t; }
// 센터 칸에서 "센터"까지 치면 바로 빼고 안내
document.addEventListener("input", (e) => {
  const t = e.target; if (!t.matches?.('#grid input[data-c="1"]')) return;
  const f = normCenter(t.value); if (f !== t.value.replace(/\s+/g, "")) { t.value = f; toast('센터명은 "센터" 없이 입력합니다 (예: 송도).'); }
}, true);
// 학생 이름·센터에는 띄어쓰기를 넣을 수 없음: 입력하는 즉시 공백 제거 (사용자 승인 탭의 이름은 빈칸 허용)
document.addEventListener("input", (e) => {
  const t = e.target;
  if (!t.matches?.('#grid input[data-c="0"], #grid input[data-c="1"]')) return;
  if (!/\s/.test(t.value)) return;
  const pos = t.selectionStart - (t.value.slice(0, t.selectionStart).match(/\s/g) || []).length;
  t.value = t.value.replace(/\s+/g, ""); try { t.setSelectionRange(pos, pos); } catch { /* 무시 */ }
}, true);

// 개인 화면(성적표 출력·학생별 성적 추이) 공통 상단: 이름 검색 / 센터 / 학생 / ◀ ▶
function personBar(centers, curC, list, curV, right = "") {
  return `<div class="row noprint pbar" style="margin-bottom:12px">
      <span class="combo"><input id="pQ" autocomplete="off" placeholder="학생 이름 검색 (전체 센터)" style="width:210px"></span>
      <span class="sub" style="margin-left:4px">센터</span><select id="pC"><option value="">전체 센터</option>${centers.map((c) => `<option ${c === curC ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
      <span class="sub" style="margin-left:4px">학생</span><select id="pS" style="min-width:170px">${list.map((o) => `<option value="${esc(o.value)}" ${o.value === curV ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>
      <button class="small" id="pPrev">◀</button><button class="small" id="pNext">▶</button>
      <div class="grow"></div>${right}</div>`;
}
// 공통 동작 연결. all: 전체 센터 학생 [{value,label,center}], list: 현재 센터 학생, go(value, center)
function personBind(all, list, curV, centerLabel, go) {
  attachCombo($("#pQ"), all.map((o) => o.label));
  $("#pQ").onchange = (e) => { const q = e.target.value.trim(); if (!q) return;
    const hit = all.filter((o) => o.label === q || o.label.split(" (")[0] === q);
    if (hit.length === 1) go(hit[0].value, hit[0].center);
    else if (hit.length > 1) toast(`${q} 학생이 ${hit.length}명입니다. 목록에서 센터까지 골라 주세요.`, 4000);
    else toast("해당 이름의 학생이 없습니다."); };
  $("#pS").onchange = (e) => go(e.target.value, null);
  const step = (d) => { const j = list.findIndex((o) => o.value === curV) + d; if (list[j]) go(list[j].value, null); else toast(`${centerLabel} ${d < 0 ? "첫 번째" : "마지막"} 학생입니다.`.trim()); };
  $("#pPrev").onclick = () => step(-1); $("#pNext").onclick = () => step(1);
}

// 저장 기록(수학·과학 각각 최근 10개)
function histHtml() {
  const part = (p, label) => { const rows = S.hist.filter((h) => h.part === p);
    return `<div class="histbox"><h4>${label} 저장 기록 <span class="muted" style="font-weight:400;font-size:12px">최근 ${rows.length}개 · 그 시점 직전 상태</span></h4>${rows.length ? `<table class="v"><thead><tr><th>저장 시각</th><th>저장한 사람</th><th>${label} 입력</th><th>학생</th><th></th></tr></thead><tbody>${rows.map((h) => `<tr><td>${new Date(h.saved_at).toLocaleString("ko-KR", { dateStyle: "short", timeStyle: "medium" })}</td><td>${esc(h.name || h.saved_by.split("@")[0])}</td><td>${h.filled}명</td><td>${h.n}명</td><td><button class="small" data-hist="${h.id}">이 시점으로 되돌리기</button></td></tr>`).join("")}</tbody></table>` : `<div class="hint">아직 기록이 없습니다.</div>`}</div>`; };
  return `<div style="margin-top:18px;border-top:1px solid var(--line2);padding-top:12px"><h3 style="margin:0 0 4px">${S.exam.year}학년도 ${S.exam.round}차 저장 기록</h3><p class="hint">입력하는 사람이 바뀌거나 10분이 지나면 바로 전 상태가 하나씩 남습니다(과목별 최근 10개). 되돌리면 그 과목만 바뀌고 다른 과목은 그대로입니다.</p>${part("math", "수학")}${part("sci", "과학")}</div>`;
}

// 이름 검색 상자: 브라우저 기본 목록 대신 화면 안에 맞춘 어두운 목록 (입력한 글자가 들어간 이름만)
function attachCombo(inp, labels) {
  const box = document.createElement("div"); box.className = "combolist hidden"; inp.parentElement.appendChild(box);
  let cur = -1, shown = [];
  const pick = (t) => { inp.value = t; box.classList.add("hidden"); inp.onchange?.({ target: inp }); };
  const draw = () => {
    const q = inp.value.trim();
    shown = (q ? labels.filter((l) => l.includes(q)) : labels).slice(0, 300); cur = -1;
    box.innerHTML = shown.length ? shown.map((l, n) => `<div class="ci" data-n="${n}">${esc(l)}</div>`).join("") : `<div class="ce">일치하는 학생이 없습니다.</div>`;
    box.classList.remove("hidden");
  };
  const mark = () => $$(".ci", box).forEach((d, n) => { d.classList.toggle("on", n === cur); if (n === cur) d.scrollIntoView({ block: "nearest" }); });
  inp.addEventListener("focus", draw); inp.addEventListener("input", draw);
  inp.addEventListener("keydown", (e) => {
    if (box.classList.contains("hidden")) return;
    if (e.key === "ArrowDown") { e.preventDefault(); cur = Math.min(shown.length - 1, cur + 1); mark(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cur = Math.max(0, cur - 1); mark(); }
    else if (e.key === "Enter") { e.preventDefault(); if (cur >= 0) pick(shown[cur]); else if (shown.length === 1) pick(shown[0]); else { box.classList.add("hidden"); inp.onchange?.({ target: inp }); } }
    else if (e.key === "Escape") box.classList.add("hidden");
  });
  box.addEventListener("mousedown", (e) => { const d = e.target.closest(".ci"); if (d) { e.preventDefault(); pick(shown[Number(d.dataset.n)]); } });
  inp.addEventListener("blur", () => setTimeout(() => box.classList.add("hidden"), 120));
}

// ---------- 학생별 성적 추이 (같은 학년도 시험들을 이름+센터로 묶음) ----------
const TREND = { cache: {}, charts: [] };
async function trendData(year) {
  const list = S.exams.filter((e) => e.year === year).sort((a, b) => a.round - b.round);
  const out = [];
  for (const e of list) {
    let ex;
    if (S.exam && S.exam.id === e.id) ex = S.exam; // 열려 있는 시험은 화면의 최신 내용(저장 전 포함)
    else {
      const key = e.id + "|" + e.updated_at;
      if (!TREND.cache[key]) TREND.cache[key] = normExam((await api("examGet", { id: e.id })).exam);
      ex = TREND.cache[key];
    }
    if (ex.students.some((s) => s.name && s.name.trim())) out.push({ round: ex.round, ex, k: calc(ex) });
  }
  return out;
}
async function viewTrend(v) {
  TREND.charts.forEach((c) => c.destroy()); TREND.charts = [];
  const year = S.year;
  if (!S.exams.some((e) => e.year === year)) { v.innerHTML = `<div class="empty warn">${year}학년도 시험이 없습니다.</div>`; return; }
  v.innerHTML = `<div class="empty">${year}학년도 시험 자료를 불러오는 중…</div>`;
  let data;
  try { data = await trendData(year); } catch (e) { v.innerHTML = `<div class="empty warn">${esc(e.message)}</div>`; return; }
  if (S.tab !== "trend") return;
  if (!data.length) { v.innerHTML = `<div class="empty warn">${year}학년도에 학생이 입력된 시험이 없습니다.</div>`; return; }
  const keyOf = (r) => r.name.trim() + "\u0001" + r.center.trim();
  const people = new Map();
  data.forEach((d) => d.k.rows.forEach((r) => { if (!people.has(keyOf(r))) people.set(keyOf(r), { name: r.name.trim(), center: r.center.trim() }); }));
  const centers = [...new Set([...people.values()].map((p) => p.center))].sort((a, b) => a.localeCompare(b, "ko"));
  if (S.trC && !centers.includes(S.trC)) S.trC = "";
  const optP = (p) => ({ value: p.name + "\u0001" + p.center, label: `${p.name} (${p.center})`, center: p.center });
  const allP = [...people.values()].map(optP).sort((a, b) => a.label.localeCompare(b.label, "ko"));
  const listP = allP.filter((o) => !S.trC || o.center === S.trC);
  if (!listP.some((o) => o.value === S.trP)) S.trP = listP[0]?.value;
  const key = S.trP;
  const rows = data.map((d) => { const i = d.k.rows.findIndex((r) => keyOf(r) === key); return i < 0 ? null : { round: d.round, k: d.k, i }; }).filter(Boolean);
  const G = [["conv", "환산 점수", (k) => k.max.ct], ["tot", "총점", (k) => k.max.tot], ["mt", "수학", (k) => k.max.mt], ["st", "과학", (k) => k.max.st]];
  const cell = (r, g) => { const c = r.k.cols[g]; return c.v[r.i] == null ? `<td class="b0 muted">미응시</td><td class="muted">-</td><td class="muted">-</td>` : `<td class="b0 big">${f1(c.v[r.i])}</td><td>${c.rk[r.i]} <span class="muted">/ ${r.k.N}</span></td><td>${fp(c.pct[r.i])}</td>`; };
  v.innerHTML = `${personBar(centers, S.trC, listP, S.trP)}
    <div class="tw" style="margin-bottom:16px"><table class="v"><thead>
      <tr><th rowspan="2">차수</th>${G.map(([, l]) => `<th colspan="3" class="b0">${l}</th>`).join("")}</tr>
      <tr class="subrow">${G.map(() => `<th class="b0">점수</th><th>석차</th><th>백분위</th>`).join("")}</tr></thead>
      <tbody>${rows.length ? rows.map((r) => `<tr><td><b>${r.round}차</b></td>${G.map(([g]) => cell(r, g)).join("")}</tr>`).join("") : `<tr><td colspan="13" class="muted">응시 기록이 없습니다.</td></tr>`}</tbody></table></div>
    <p class="hint" style="margin:-8px 0 14px">${year}학년도 시험 ${data.length}개에서 이름·센터가 같은 학생을 묶어 보여 줍니다. 석차·백분위는 그 시험 전체(전 센터) 기준입니다.</p>
    <div class="trgrid">${G.map(([g, l]) => ["점수", "석차", "백분위"].map((t) => `<div class="card trc"><div class="trt">${l} ${t} 추이</div><div class="trbox"><canvas data-g="${g}" data-t="${t}"></canvas></div></div>`).join("")).join("")}</div>`;
  personBind(allP, listP, S.trP, S.trC ? `${S.trC} 센터의` : "", (val, center) => { if (center != null && S.trC && S.trC !== center) S.trC = center; S.trP = val; viewTrend(v); });
  $("#pC").onchange = (e) => { S.trC = e.target.value; S.trP = null; viewTrend(v); };
  if (!rows.length || !window.Chart) return;
  Chart.defaults.font.family = '"WZP","Pretendard","Malgun Gothic",sans-serif';
  const labels = rows.map((r) => r.round + "차");
  const valPlugin = { id: "trv", afterDatasetsDraw(ch) { const g = ch.ctx; g.save(); g.textAlign = "center"; g.font = "bold 12px WZP, Pretendard, sans-serif"; g.fillStyle = "#e2e8f0";
    ch.getDatasetMeta(0).data.forEach((pt, j) => { const y = ch.data.datasets[0].raw[j]; if (y != null) g.fillText(ch.data.datasets[0].fmt(y), pt.x, pt.y - 10); }); g.restore(); } };
  $$("canvas[data-g]", v).forEach((cv) => {
    const g = cv.dataset.g, t = cv.dataset.t, gi = G.find((x) => x[0] === g);
    const raw = rows.map((r) => { const c = r.k.cols[g]; return t === "점수" ? c.v[r.i] : t === "석차" ? c.rk[r.i] : (isNum(c.pct[r.i]) ? Math.round(c.pct[r.i] * 1000) / 10 : null); });
    const maxY = t === "점수" ? Math.max(...rows.map((r) => gi[2](r.k))) : t === "석차" ? Math.max(...rows.map((r) => r.k.N)) : 100;
    const col = { conv: "#5eead4", tot: "#a5b4fc", mt: "#fbbf24", st: "#f9a8d4" }[g];
    TREND.charts.push(new Chart(cv, {
      type: "line",
      data: { labels, datasets: [{ data: raw, raw, fmt: (y) => (t === "점수" ? f1(y) : t === "석차" ? y + "등" : y.toFixed(1) + "%"), borderColor: col, backgroundColor: col, pointRadius: 4, pointHoverRadius: 6, tension: .3, spanGaps: false }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, layout: { padding: { top: 22, left: 10, right: 26 } },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => c.dataset.fmt(c.raw) } } },
        scales: { x: { ticks: { color: "#cbd5e1", font: { size: 12, weight: "bold" } }, grid: { display: false } },
          y: { reverse: t !== "점수", min: t === "점수" ? 0 : (t === "석차" ? 1 : 0), max: maxY, ticks: { color: "#64748b", font: { size: 10 } }, grid: { color: "rgba(148,163,184,.12)" } } } },
      plugins: [valPlugin],
    }));
  });
}

function reportHtml(ex, k, i) {
  const r = k.rows[i], c = ex.config;
  const mA = k.mA, sA = k.sA;
  const val = (key) => k.cols[key].v[i], pct = (key) => fp(k.cols[key].pct[i], "미응시"), rk = (key) => k.cols[key].rk[i];
  const head = `<tr><th rowspan="2" style="width:74px">구분</th><th colspan="${mA.length + 1}">수학</th><th colspan="${sA.length + 1}">과학</th><th rowspan="2">종합</th></tr>
    <tr>${mA.map((a) => `<th>${esc(a)}</th>`).join("")}<th>수학 계</th>${sA.map((a) => `<th>${esc(a)}</th>`).join("")}<th>과학 계</th></tr>`;
  const line = (label, arr, cls = "") => `<tr class="${cls}"><th class="rh">${label}</th>${arr.map((x) => `<td>${x}</td>`).join("")}</tr>`;
  const mKeys = mA.map((_, j) => "m" + j), sKeys = sA.map((_, j) => "s" + j);
  const allKeys = [...mKeys, "mt", ...sKeys, "st", "tot"];
  const maxes = [...k.max.m, k.max.mt, ...k.max.s, k.max.st, k.max.tot].map(fmax);
  const avgs = [...k.A.m, k.A.mt, ...k.A.s, k.A.st, k.A.tot].map(f1);
  const mine = allKeys.map((key) => f1(val(key)));
  const pcts = allKeys.map(pct);
  const cm = r.cm, cs = r.cs;
  const rkStr = (key) => (rk(key) == null ? "미응시" : `${rk(key)} / ${k.N}`);
  const cutRows = k.cuts.map((x) => `<tr><th class="rh" rowspan="2">${esc(x.name)}</th><th class="rh">점수</th><td>${f1(x.math)}</td><td>${f1(x.sci)}</td><td>${f1(x.tot)}</td></tr>
     <tr><th class="rh">백분위</th><td>${fp(x.pm)}</td><td>${fp(x.ps)}</td><td>${fp(x.pt)}</td></tr>`).join("");
  const kpi = (label, v, unit, cls = "") => `<div class="kp ${cls}"><div class="k">${label}</div><div class="v">${v}${unit ? `<small>${unit}</small>` : ""}</div></div>`;
  return `<div class="rp">
   <div class="hd"><img src="${WZ_LOGO}" alt="와이즈만">
     <div class="tt"><div class="t1">${ex.year}학년도 영재학교 대비</div><div class="t2">${esc(c.title)} <b>${ex.round}차</b> 결과표</div></div></div>
   <div class="who">
     <div class="id"><div class="k">학생명</div><div class="v">${esc(r.name)}</div><div class="c">${esc(r.center)} 센터</div></div>
     ${kpi("환산 총점", f1(val("conv")), "/ " + fmax(k.max.ct), "hl")}
     ${kpi("환산 석차", rk("conv") ?? "-", "/ " + k.N)}
     ${kpi("환산 백분위", pct("conv"), "")}
     ${kpi("종합 점수", f1(val("tot")), "/ " + fmax(k.max.tot))}
   </div>
   <div class="sec">성취도 점수 <span>영역별 원점수</span></div>
   <table><thead>${head}</thead><tbody>${line("만점", maxes)}${line("전체 평균", avgs)}${line("개인 점수", mine, "me")}${line("백분위", pcts)}</tbody></table>
   <div class="note">▷ 수학 점수는 ${mA.join(", ")}, 과학 점수는 ${sA.join(", ")} 각 영역 점수를 합한 점수입니다. 종합 점수는 수학·과학 점수의 합이며, 1개 과목만 응시한 경우 응시 과목 점수만 나타납니다.</div>
   <div class="two">
     <div><div class="sec">환산 점수</div>
       <table><thead><tr><th>구분</th><th>수학 환산</th><th>과학 환산</th><th>환산 총점</th></tr></thead><tbody>
       ${line("만점", [fmax(k.max.cm), fmax(k.max.cs), fmax(k.max.ct)])}
       ${line("전체 평균", [f1(k.A.cm), f1(k.A.cs), f1(k.A.ct)])}
       ${line("개인 점수", [f1(cm), f1(cs), f1(val("conv"))], "me")}
       ${line("백분위", [pct("mt"), pct("st"), pct("conv")])}
       ${line("석차", [rkStr("mt"), rkStr("st"), rkStr("conv")])}</tbody></table>
       <div class="note">▷ 환산 점수는 수학과 과학의 비율을 조정한 점수입니다.</div></div>
     <div><div class="sec">학교별 합격 커트라인 <span>예상 · 환산 점수 기준</span></div>
       <table><thead><tr><th colspan="2">구분</th><th>수학 환산</th><th>과학 환산</th><th>환산 총점</th></tr></thead><tbody>${cutRows || `<tr><td colspan="5">-</td></tr>`}</tbody></table>
       <div class="note">▷ 합격 커트라인(예상)은 합격선 가이드입니다. 자기소개서, 생활기록부, 캠프, 면접 등을 반영하지 않았기에 현 성취도 결과만으로 최종 합격 여부를 보장하지는 않습니다.</div></div>
   </div>
   <div class="sec">성취도 그래프 <span>환산 점수 기준</span></div>
   <div class="chartbox"><canvas width="688" height="228"></canvas></div>
   <div class="foot"><span><b>WEIZMANN</b>&nbsp; 와이즈만 영재교육 · ${esc(c.title)} ${ex.round}차</span><span>${esc(r.center)} · ${esc(r.name)} · 1/2</span></div>
  </div>${reportPage2(ex, k, i)}`;
}
// 성적표 2쪽: 문항별 상세 점수 (문항이 많으면 여러 줄로 나눠 같은 칸 너비로 표시)
function reportPage2(ex, k, i) {
  const r = k.rows[i], c = ex.config, st = k.stu[i], PER = 13;
  const block = (key, label) => {
    const items = c[key].items, my = (key === "math" ? st.m : st.s) || [], av = key === "math" ? k.itemAvg.m : k.itemAvg.s;
    const took = my.some(isNum);
    if (!items.length) return `<div class="sec">${label} 문항별 점수</div><div class="note">문항 정보가 없습니다.</div>`;
    const nb = Math.ceil(items.length / PER), per = Math.ceil(items.length / nb);
    const tbls = [];
    for (let b = 0; b < nb; b++) {
      const ids = items.map((_, j) => j).slice(b * per, b * per + per);
      const pad = (row) => Array(per - ids.length).fill(row ? `<td class="pad"></td>` : `<th class="pad"></th>`).join("");

const pdfName = (ex, r) => safeName(`${ex.config.title} [${ex.round}차] 결과표 [${r.center}] ${r.name}.pdf`);
// PDF에 Pretendard를 넣기 위한 글꼴 정보 (한 번만 만들어 재사용, 실패하면 시스템 글꼴)
let FONT_CSS = null;
async function fontOpt() {
  if (FONT_CSS === null) {
    try {
      const rules = [];
      for (const w of [["Regular", 400], ["SemiBold", 600], ["Bold", 700], ["ExtraBold", 800]]) {
        const b = await fetch(`https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-${w[0]}.woff2`).then((r) => { if (!r.ok) throw 0; return r.blob(); });
        const url = await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); });
        rules.push(`@font-face{font-family:"WZP";font-weight:${w[1]};src:url(${url}) format("woff2")}`);
      }
      FONT_CSS = rules.join("\n");
      await document.fonts.load('700 12px "WZP"');
    } catch { FONT_CSS = ""; }
  }
  return FONT_CSS ? { fontEmbedCSS: FONT_CSS } : { skipFonts: true };
}
async function pdfOf(ex, k, i) {
  await needPDF();
  await fontOpt();
  const st = $("#rpStage"); st.innerHTML = reportHtml(ex, k, i);
  const ch = drawChart(st, k, i);
  try {
    const pdf = new jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    const pages = [...st.querySelectorAll(".rp")];
    for (let p = 0; p < pages.length; p++) {
      const canvas = await htmlToImage.toCanvas(pages[p], { pixelRatio: 2, backgroundColor: "#ffffff", width: 794, height: 1123, ...(await fontOpt()) });
      if (p) pdf.addPage();
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 210, 297);
    }
    return pdf.output("blob");
  } finally { ch.destroy(); st.innerHTML = ""; }
}
async function zipAll(ex, k, idx) {
  if (!idx.length) return;
  if (!(await confirmBox(`${S.center || "전체 센터"} 학생 ${idx.length}명의 성적표 PDF를 만들어 ZIP 파일로 내려받습니다.\n${S.dirty ? "※ 저장하지 않은 변경 내용도 반영됩니다.\n" : ""}만드는 동안 화면을 닫지 마세요.`, "만들기"))) return;
  try {
    await needZip(); await needPDF();
    const zip = new JSZip(); let n = 0;
    busy(`성적표 만드는 중… (0/${idx.length})`);
    for (const i of idx) {
      let fn = pdfName(ex, k.rows[i]); for (let d = 2; zip.file(fn); d++) fn = pdfName(ex, k.rows[i]).replace(/\.pdf$/, ` (${d}).pdf`); // 같은 파일 이름이면 덮어쓰지 않음
      zip.file(fn, await pdfOf(ex, k, i));
      n++; $("#busyMsg").textContent = `성적표 만드는 중… (${n}/${idx.length})`; busyProg(n / idx.length);
      await new Promise((r) => setTimeout(r, 0));
    }
    $("#busyMsg").textContent = "ZIP 파일로 묶는 중…";
    const blob = await zip.generateAsync({ type: "blob" });
    download(blob, safeName(`${ex.year}학년도 ${ex.round}차 성적표_${S.center || "전체"}_${idx.length}명.zip`));
    toast(`${idx.length}명 성적표를 내려받았습니다.`);
  } catch (e) { toast(e.message, 5000); } finally { busy(); }
}

      if (!(await confirmBox(`${ex.year}학년도 ${ex.round}차 시험(학생 ${ex.n}명)을 삭제할까요?\n삭제 직전 내용은 백업으로 남지만 화면에서는 사라집니다.`, "삭제"))) return;
      try { await api("examDelete", { id: ex.id }); if (S.exam?.id === ex.id) { S.exam = null; setDirty(false); } await loadList(); render(); toast("삭제했습니다."); } catch (err) { toast(err.message); }
    } else if (t.dataset.hist) {
      const h = S.hist.find((x) => x.id === Number(t.dataset.hist)); if (!h) return;
      const pk = h.part === "math" ? "수학" : "과학";
      if (!(await confirmBox(`${S.exam.year}학년도 ${S.exam.round}차 ${pk}를 ${new Date(h.saved_at).toLocaleString("ko-KR")} 저장본(${pk} 입력 ${h.filled}명)으로 되돌릴까요?\n${pk === "수학" ? "과학" : "수학"} 점수는 그대로 둡니다. 지금 내용도 저장 기록에 남으니 다시 되돌릴 수 있습니다.`, "되돌리기"))) return;
      try { await flushAll(); await api("histRestore", { hid: h.id }); await loadList(); await reloadExam(); render(); toast("되돌렸습니다."); } catch (err) { toast(err.message, 4000); }
    } else if (t.id === "impGo") runImport();
    else if (t.id === "impClr") { pending = []; renderImp(); }
  };
  $("#impF").onchange = async (e) => {
    await needXLSX();
    for (const f of e.target.files) await addImportBuf(f.name, await f.arrayBuffer());
    e.target.value = "";
  };
  renderImp();
}
async function addImportBuf(name, buf) {
  await needXLSX();
  try { const p = parseTool(XLSX.read(buf, { type: "array" }), name); pending = pending.filter((x) => !(x.year === p.year && x.round === p.round)); pending.push(p); }
  catch (err) { pending.push({ error: err.message, file: name }); }
  pending.sort((a, b) => (a.year || 0) - (b.year || 0) || (a.round || 0) - (b.round || 0));
  if (S.tab === "manage") renderImp();
}
function renderImp() {
  const el = $("#impList"); if (!el) return;
  if (!pending.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<table class="v"><thead><tr><th>파일</th><th>학년도</th><th>차수</th><th>수학</th><th>과학</th><th>학생</th><th>커트라인</th><th>상태</th></tr></thead><tbody>
    ${pending.map((p) => p.error ? `<tr><td class="l">${esc(p.file)}</td><td colspan="7" style="color:#fca5a5">${esc(p.error)}</td></tr>` :
      `<tr><td class="l" style="max-width:220px;overflow:hidden;text-overflow:ellipsis">${esc(p.file)}</td><td>${p.year}</td><td>${p.round}차</td><td>${p.config.math.items.length}문항 ${fmax(p.config.math.items.reduce((x, y) => x + y.max, 0))}점</td><td>${p.config.sci.items.length}문항 ${fmax(p.config.sci.items.reduce((x, y) => x + y.max, 0))}점</td><td>${p.students.length}명</td><td>${p.config.cutoffs.length}개</td>
       <td>${S.exams.some((e) => e.year === p.year && e.round === p.round) ? `<span class="pill" style="color:var(--warn)">덮어쓰기</span>` : `<span class="pill" style="color:var(--ok)">새로 추가</span>`}</td></tr>`).join("")}</tbody></table>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="small ghost" id="impClr">목록 비우기</button><button class="primary" id="impGo">가져오기 실행</button></div>`;
}
async function runImport() {
  const ok = pending.filter((p) => !p.error);
  if (!ok.length) return;
  const over = ok.filter((p) => S.exams.some((e) => e.year === p.year && e.round === p.round));
  const capN = ok.reduce((a, p) => a + overScores(p.config, p.students).length, 0);
  if (!(await confirmBox(`${ok.length}개 시험을 가져옵니다.${over.length ? `\n이미 있는 ${over.map((p) => p.year + "학년도 " + p.round + "차").join(", ")}는 내용을 바꿉니다(직전 내용은 백업).` : ""}${capN ? `\n※ 문항 만점을 넘는 점수 ${capN}개는 문항 만점으로 맞춰서 가져옵니다.` : ""}`, "가져오기"))) return;
  ok.forEach((p) => { capScores(overScores(p.config, p.students)); p.students.forEach((s) => { s.name = String(s.name || "").replace(/\s+/g, ""); s.center = normCenter(s.center); }); });
  busy("가져오는 중…"); let n = 0;
  try {
    for (const p of ok) {
      await api("examSave", { year: p.year, round: p.round, config: p.config, students: p.students, overwrite: true });
      n++; busyProg(n / ok.length);
    }
    pending = []; await loadList(); S.year = ok[ok.length - 1].year; $("#selYear").value = S.year; renderSide(); render(); toast(`${n}개 시험을 가져왔습니다.`);
  } catch (e) { toast(`${n}개까지 가져오고 오류: ${e.message}`, 6000); await loadList(); render(); } finally { busy(); }
}
// 기존 툴 xlsx 해석: [N차] 성적입력 / [N차] 성적표 출력
function parseTool(wb, file) {
  const names = wb.SheetNames;
  const inName = names.find((n) => n.includes("성적입력"));
  if (!inName) throw new Error("'성적입력' 탭을 찾지 못했습니다.");
  const rpName = names.find((n) => n.includes("성적표 출력"));
  const aoa = (n) => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "" });
  const A = aoa(inName), RP = rpName ? aoa(rpName) : [];
  const flat = RP.slice(0, 3).flat().map(String).join(" ");
  const roundM = (inName + " " + file).match(/\[?(\d+)\s*차\]?/), yearM = (flat + " " + file).match(/(20\d\d)\s*학년도/);
  if (!roundM) throw new Error("차수를 알 수 없습니다(탭 이름에 [N차]가 없음).");
  if (!yearM) throw new Error("학년도를 알 수 없습니다(성적표 제목에 'OOOO학년도'가 없음).");
  const r2 = A[1] || [], r3 = A[2] || [], r4 = A[3] || [], r5 = A[4] || [];
  const cM = r2.findIndex((x) => String(x).trim() === "수학"), cS = r2.findIndex((x) => String(x).trim() === "과학");
  if (cM < 0 || cS < 0) throw new Error("성적입력 탭 2행에서 '수학'/'과학' 제목을 찾지 못했습니다.");
  let cEndM = r2.findIndex((x, i) => i > cM && String(x).trim() === "이름"); if (cEndM < 0) cEndM = cS;
  let cEndS = r2.findIndex((x, i) => i > cS && /영역별|자동/.test(String(x))); if (cEndS < 0) cEndS = r2.length;
  const cAuto = (A[0] || []).findIndex((x) => /자동 산출/.test(String(x))); if (cAuto > cS && cAuto < cEndS) cEndS = cAuto;
  const cols = (a, b) => { const out = []; for (let c = a; c < b; c++) if (String(r3[c] ?? "").trim() !== "") out.push(c); return out; };
  const mC = cols(cM, cEndM), sC = cols(cS, cEndS);
  const item = (c) => ({ no: fixNo(r3[c]), area: AREA_MAP[String(r4[c]).trim()[0]] || String(r4[c]).trim(), max: Number(r5[c]) || 0 });
  const num = (x) => { if (x === "" || x == null) return null; const n = typeof x === "number" ? x : Number(String(x).replace(/,/g, "")); return Number.isFinite(n) ? n : null; };
  const students = [];
  for (let r = 6; r < A.length; r++) {
    const row = A[r] || [], name = String(row[1] ?? "").trim();
    if (!name) continue;
    students.push({ name, center: String(row[2] ?? "").trim(), m: mC.map((c) => num(row[c])), s: sC.map((c) => num(row[c])) });
  }
  const cutoffs = [];
  RP.forEach((row) => { if (String(row[7] ?? "").trim() === "점수" && String(row[5] ?? "").trim()) cutoffs.push({ name: String(row[5]).trim(), math: num(row[8]), sci: num(row[9]) }); });
  const t2 = RP.slice(0, 3).map((r) => String(r[0] ?? "")).find((s) => /결과표/.test(s)) || "";
  const title = t2.replace(/\[\s*\d+\s*차\s*\]/, "").replace(/결과표/, "").trim() || "와이즈만 전국 모의고사";
  return { file, year: Number(yearM[1]), round: Number(roundM[1]),
    config: { title, date: "", math: { areas: ["기하", "조합", "대수"], items: mC.map(item) }, sci: { areas: ["물리", "화학", "생명과학", "지구과학"], items: sC.map(item) }, conv: { math: "1.2", sci: "2/3" }, cutoffs, memo: "" },
    students };
}
// 구글 시트 탭에서 보낸 파일 받기 (docs.google.com 에서 온 것만)
window.addEventListener("message", (e) => {
  if (e.origin !== "https://docs.google.com" || !token) return;
  const d = e.data;
  if (d && d.type === "wmock-xlsx" && d.buf instanceof ArrayBuffer) { addImportBuf(String(d.name || "sheet.xlsx"), d.buf); e.source?.postMessage?.({ type: "wmock-ack", name: d.name }, e.origin); }
});

// ======================= 시작 =======================
(async () => { if (token) { try { await startApp(); return; } catch { /* 로그인 필요 */ } } showLogin(); })();
</script>
